[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "study-planner"
version = "1.0.0"
description = "A modern task management application for students built with clean architecture and type safety"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "seagulls-9", email = "contact@github.com" }]
keywords = [
    "study",
    "planner",
    "task-management",
    "education",
    "python",
    "clean-architecture",
    "type-hints",
    "gui",
    "cli"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Office/Business",
]

dependencies = [
    "customtkinter>=5.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://github.com/seagulls-9/Study_planner"
Documentation = "https://github.com/seagulls-9/Study_planner#readme"
Repository = "https://github.com/seagulls-9/Study_planner.git"
Issues = "https://github.com/seagulls-9/Study_planner/issues"

[project.scripts]
study-planner = "study_planner.study_planner_gui:main"
study-planner-cli = "study_planner.cli:run"

[tool.setuptools]
packages = ["study_planner"]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py10", "py311", "py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # line-too-long (black handles this)

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
